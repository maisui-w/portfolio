<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24466f"/><stop offset="100%" stop-color="#3a5a50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#f7f2e9"/>
  <!-- 网格 -->
  <g stroke="#24466f" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="560"/><line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/><line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="500" y1="0" x2="500" y2="560"/><line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#2b3138">企业私有知识库 RAG 平台</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6472">FastAPI · ChromaDB · LangChain · Docker</text>
  <!-- 节点 -->
  <g font-family="Arial" font-size="14" text-anchor="middle">
    <rect x="40" y="180" width="140" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="110" y="218" fill="#2b3138">文档解析</text>
    <rect x="240" y="180" width="140" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="310" y="218" fill="#2b3138">切片 + Embedding</text>
    <rect x="440" y="180" width="150" height="70" rx="12" fill="url(#g)"/>
    <text x="515" y="218" fill="#ffffff">ChromaDB 向量库</text>
    <rect x="650" y="180" width="120" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="710" y="218" fill="#2b3138">混合检索</text>
  </g>
  <g stroke="#24466f" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M180 215 H238" marker-end="url(#arr)"/>
    <path d="M380 215 H438" marker-end="url(#arr)"/>
    <path d="M590 215 H648" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#24466f" stroke="none"/>
    </marker>
  </defs>
  <!-- 下方特性 -->
  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="80" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="170" y="354" fill="#24466f">ACL 权限隔离</text>
    <text x="170" y="372" fill="#5b6472" font-size="11">部门级 · 403 拦截</text>
    <rect x="310" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="400" y="354" fill="#24466f">Token 计费</text>
    <text x="400" y="372" fill="#5b6472" font-size="11">成本管控看板</text>
    <rect x="540" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="630" y="354" fill="#24466f">Ollama 本地模型</text>
    <text x="630" y="372" fill="#5b6472" font-size="11">数据不出内网</text>
  </g>
