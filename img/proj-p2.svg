<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24466f"/><stop offset="100%" stop-color="#3a5a50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#f7f2e9"/>
  <g stroke="#24466f" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="560"/><line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/><line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="500" y1="0" x2="500" y2="560"/><line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#2b3138">企业销售智能 Agent</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6472">FastAPI · LangChain · SSE 流式 · smtplib</text>
  <!-- Agent 循环 -->
  <g font-family="Arial" font-size="14" text-anchor="middle">
    <rect x="290" y="160" width="220" height="70" rx="12" fill="url(#g)"/>
    <text x="400" y="198" fill="#ffffff">LLM Agent 推理</text>
    <text x="400" y="218" fill="#dfe6ee" font-size="11">ReAct 循环 · 最多 5 轮</text>
  </g>
  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="60" y="300" width="160" height="60" rx="10" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="140" y="328" fill="#2b3138">rag_search</text>
    <text x="140" y="346" fill="#5b6472" font-size="11">检索知识库</text>
    <rect x="320" y="300" width="160" height="60" rx="10" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="400" y="328" fill="#2b3138">generate_email</text>
    <text x="400" y="346" fill="#5b6472" font-size="11">生成个性化邮件</text>
    <rect x="580" y="300" width="160" height="60" rx="10" fill="#ffffff" stroke="#24466f" stroke-opacity="0.4"/>
    <text x="660" y="328" fill="#2b3138">analyze_customer</text>
    <text x="660" y="346" fill="#5b6472" font-size="11">分析客户需求</text>
  </g>
  <g stroke="#24466f" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M400 230 C400 250 140 250 140 298" marker-end="url(#arr2)"/>
    <path d="M400 230 C400 255 400 260 400 298" marker-end="url(#arr2)"/>
    <path d="M400 230 C400 250 660 250 660 298" marker-end="url(#arr2)"/>
  </g>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#24466f" stroke="none"/>
    </marker>
  </defs>
  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="140" y="400" width="240" height="56" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="260" y="424" fill="#24466f">SSE 流式输出</text>
    <text x="260" y="444" fill="#5b6472" font-size="11">token / tool / email / done 事件</text>
    <rect x="430" y="400" width="240" height="56" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="550" y="424" fill="#24466f">邮件审核 → 发送</text>
    <text x="550" y="444" fill="#5b6472" font-size="11">pending / approved / sent 状态机</text>
  </g>
