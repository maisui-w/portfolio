<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24466f"/><stop offset="100%" stop-color="#3a5a50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#f7f2e9"/>
  <g stroke="#24466f" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="560"/><line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/><line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="500" y1="0" x2="500" y2="560"/><line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#2b3138">自媒体文章自动化生产工作台</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial" font-size="15" fill="#5b6472">Vue3 · FastAPI · Tavily · 公众号接入</text>
  <!-- 7 字段工作流流水线 -->
  <g font-family="Arial" font-size="12" text-anchor="middle">
    <rect x="70" y="150" width="100" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.5"/>
    <text x="120" y="182" fill="#24466f">关键词</text>
    <text x="120" y="202" fill="#5b6472" font-size="11">选题</text>
    <text x="182" y="188" fill="#ff8a4c" font-weight="700">→</text>
    <rect x="200" y="150" width="100" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.5"/>
    <text x="250" y="182" fill="#24466f">实时搜索</text>
    <text x="250" y="202" fill="#5b6472" font-size="11">Tavily</text>
    <text x="312" y="188" fill="#ff8a4c" font-weight="700">→</text>
    <rect x="330" y="150" width="100" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.5"/>
    <text x="380" y="182" fill="#24466f">竞品分析</text>
    <text x="380" y="202" fill="#5b6472" font-size="11">AI 拆解</text>
    <text x="442" y="188" fill="#ff8a4c" font-weight="700">→</text>
    <rect x="460" y="150" width="100" height="70" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.5"/>
    <text x="510" y="182" fill="#24466f">AI 初稿</text>
    <text x="510" y="202" fill="#5b6472" font-size="11">模型生成</text>
    <text x="572" y="188" fill="#ff8a4c" font-weight="700">→</text>
    <rect x="590" y="150" width="100" height="70" rx="12" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="640" y="182" fill="#24466f">去 AI 痕迹</text>
    <text x="640" y="202" fill="#5b6472" font-size="11">润色</text>
  </g>
  <!-- 工作流表格示意 -->
  <g font-family="Arial" font-size="12">
    <rect x="120" y="270" width="560" height="150" rx="12" fill="#ffffff" stroke="#24466f" stroke-opacity="0.3"/>
    <rect x="120" y="270" width="140" height="30" rx="12" fill="#24466f"/>
    <text x="140" y="290" fill="#ffffff">行 = 文章任务</text>
    <rect x="260" y="270" width="420" height="30" rx="12" fill="#faf6ef"/>
    <text x="280" y="290" fill="#24466f">列 = 工作流字段 · 单元格 = 最小执行单元</text>
    <text x="150" y="330" fill="#5b6472">文章A：已完成 ✅</text>
    <text x="150" y="360" fill="#5b6472">文章B：生成中 ⏳</text>
    <text x="150" y="390" fill="#5b6472">文章C：待发布 📮</text>
    <rect x="420" y="332" width="120" height="34" rx="8" fill="#ff8a4c" opacity="0.9"/>
    <text x="480" y="354" text-anchor="middle" fill="#ffffff">公众号草稿</text>
  </g>
  <g font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="90" y="440" width="200" height="56" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="190" y="464" fill="#24466f">7 字段流水线</text>
    <text x="190" y="484" fill="#5b6472" font-size="11">每步人工可控</text>
    <rect x="330" y="440" width="200" height="56" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="430" y="464" fill="#24466f">万级虚拟滚动</text>
    <text x="430" y="484" fill="#5b6472" font-size="11">36 个测试用例</text>
    <rect x="570" y="440" width="140" height="56" rx="10" fill="#ffffff" stroke="#ff8a4c" stroke-opacity="0.6"/>
    <text x="640" y="464" fill="#24466f">发布接入</text>
    <text x="640" y="484" fill="#5b6472" font-size="11">公众号草稿</text>
  </g>
</svg>
